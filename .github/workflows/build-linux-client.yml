name: Build Linux test client
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:linux
      - name: Inspect executable contents and checksum
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          image="release/GoLive P2P-${version}.AppImage"
          chmod +x "$image"
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/resources/app.asar
          test -f squashfs-root/libffmpeg.so
          test -f squashfs-root/chrome-sandbox
          mv "$image" "release/GoLive-P2P-Client-${version}.AppImage"
          cd release
          sha256sum "GoLive-P2P-Client-${version}.AppImage" > "SHA256SUMS-linux-client-${version}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-test-client
          path: |
            release/GoLive-P2P-Client-*.AppImage
            release/SHA256SUMS-linux-client-*.txt
          if-no-files-found: error
