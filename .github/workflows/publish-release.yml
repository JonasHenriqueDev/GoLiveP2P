name: Publish release binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:all
      - name: Verify complete executables and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv 'release/GoLive P2P-0.3.0.AppImage' release/GoLive-P2P-0.3.0.AppImage
          cd release
          sha256sum GoLive-P2P-Portable-0.3.0.exe GoLive-P2P-0.3.0.AppImage > SHA256SUMS-0.3.0.txt
          test $(stat -c%s GoLive-P2P-Portable-0.3.0.exe) -gt 50000000
          test $(stat -c%s GoLive-P2P-0.3.0.AppImage) -gt 50000000
          gh release upload v0.3.0 GoLive-P2P-Portable-0.3.0.exe GoLive-P2P-0.3.0.AppImage SHA256SUMS-0.3.0.txt --clobber
