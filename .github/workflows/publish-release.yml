name: Publish release binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:all
      - name: Verify complete executables and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv "release/GoLive P2P-${VERSION}.AppImage" "release/GoLive-P2P-${VERSION}.AppImage"
          cd release
          sha256sum "GoLive-P2P-Setup-${VERSION}.exe" "GoLive-P2P-${VERSION}.AppImage" > "SHA256SUMS-${VERSION}.txt"
          test $(stat -c%s "GoLive-P2P-Setup-${VERSION}.exe") -gt 50000000
          test $(stat -c%s "GoLive-P2P-${VERSION}.AppImage") -gt 50000000
          test -s latest.yml
          test -s "GoLive-P2P-Setup-${VERSION}.exe.blockmap"
          gh release upload "v${VERSION}" "GoLive-P2P-Setup-${VERSION}.exe" "GoLive-P2P-Setup-${VERSION}.exe.blockmap" latest.yml "GoLive-P2P-${VERSION}.AppImage" "SHA256SUMS-${VERSION}.txt" --clobber
