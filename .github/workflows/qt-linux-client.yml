name: Qt Linux receive-only client
on:
  workflow_dispatch:
  push:
    branches: [native/windows-media-engine]
    paths: ['native/qt/**', 'native/windows/media-engine.cpp', 'native/windows/*-buffer*', 'native/windows/audio-*', 'native/windows/opus-*', 'native/windows/srtp-*', '.github/workflows/qt-linux-client.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native SDK dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-nice xvfb
          python -m pip install aqtinstall
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/qt" --archives qtbase qttools icu --modules qtwebsockets
      - name: Build C++ UI and native receiver
        run: |
          export QT_ROOT="$RUNNER_TEMP/qt/6.8.3/gcc_64"
          export LD_LIBRARY_PATH="$QT_ROOT/lib:$LD_LIBRARY_PATH"
          cmake -S native/qt -B work/qt-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build work/qt-linux
          ctest --test-dir work/qt-linux --output-on-failure
          cat work/qt-linux/qt-tests.txt
          mkdir -p work/qt-linux/native-media
          cp work/qt-linux/media-engine work/qt-linux/native-media/
          printf '{"v":1,"id":1,"method":"capabilities","data":{}}\n' | work/qt-linux/media-engine > work/qt-linux/engine-smoke.txt
          xvfb-run -a 'work/qt-linux/GoLive P2P' --runtime=work/qt-linux/native-media --duration=3 --report=work/qt-linux/ui-smoke.json
          test -s work/qt-linux/ui-smoke.json
      - name: Package receive-only client
        run: |
          export QT_ROOT="$RUNNER_TEMP/qt/6.8.3/gcc_64"
          bash native/qt/package-linux.sh "$QT_ROOT" work/qt-linux
          env LD_LIBRARY_PATH="$PWD/release/qt-linux/lib" GST_PLUGIN_PATH="$PWD/release/qt-linux/native-media/lib/gstreamer-1.0" GST_PLUGIN_SYSTEM_PATH="$PWD/release/qt-linux/native-media/lib/gstreamer-1.0" GST_PLUGIN_SCANNER="$PWD/release/qt-linux/native-media/gst-plugin-scanner" GST_REGISTRY="$PWD/work/qt-linux/srtp-registry.bin" work/qt-linux/srtp-runtime-test > work/qt-linux/packaged-srtp.json
          env -u LD_LIBRARY_PATH xvfb-run -a release/qt-linux/golive --duration=3 --report=work/qt-linux/packaged-smoke.json
          test -s work/qt-linux/packaged-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: qt-linux-client
          path: |
            release/GoLive-P2P-0.6.0-qt.4-linux-x64.tar.gz
            release/SHA256SUMS-linux-0.6.0-qt.4.txt
            work/qt-linux/player-tests.txt
            work/qt-linux/Testing/Temporary/LastTest.log
            work/qt-linux/qt-tests.txt
            work/qt-linux/ui-smoke.json
            work/qt-linux/engine-smoke.txt
            work/qt-linux/packaged-smoke.json
            work/qt-linux/packaged-srtp.json
            work/qt-linux/srtp-runtime-test
          if-no-files-found: error
  rpm:
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM verification tools
        run: dnf install -y rpm-build curl tar gzip python3 desktop-file-utils xorg-x11-server-Xvfb xorg-x11-xauth mesa-libGL mesa-libEGL alsa-lib rpmlint
      - uses: actions/download-artifact@v4
        with:
          name: qt-linux-client
          path: work/qt-client
      - name: Verify the newly built client
        run: |
          cd work/qt-client
          sha256sum --check --strict release/SHA256SUMS-linux-0.6.0-qt.4.txt
      - name: Build Fedora RPM
        run: bash native/qt/linux/build-rpm.sh work/qt-client/release/GoLive-P2P-0.6.0-qt.4-linux-x64.tar.gz
      - name: Install and verify the actual RPM
        run: |
          set -e
          dnf install -y ./release/GoLive-P2P-0.6.0-qt.4-fedora-x86_64.rpm
          rpm -qi golive-p2p > work/rpm-info.txt
          rpm -ql golive-p2p > work/rpm-files.txt
          rpm -V golive-p2p > work/rpm-verify.txt
          test ! -s work/rpm-verify.txt
          test -x /usr/bin/golive-p2p
          desktop-file-validate /usr/share/applications/golive-p2p.desktop
          # Record lint including expected third-party/private bundled-runtime
          # warnings; this package is not submitted to the Fedora repositories.
          rpmlint release/*.rpm > work/rpmlint.txt 2>&1 || true
          Xvfb :99 -screen 0 1280x800x24 > work/xvfb.log 2>&1 &
          sleep 2
          env -u LD_LIBRARY_PATH DISPLAY=:99 golive-p2p --duration=4 --report=work/rpm-smoke.json
          # Exercise real encrypted RTP with only the installed private runtime.
          # A startup smoke test cannot detect missing dlopen NSS modules.
          chmod +x work/qt-client/work/qt-linux/srtp-runtime-test
          env LD_LIBRARY_PATH=/opt/golive-p2p/lib GST_PLUGIN_PATH=/opt/golive-p2p/native-media/lib/gstreamer-1.0 GST_PLUGIN_SYSTEM_PATH=/opt/golive-p2p/native-media/lib/gstreamer-1.0 GST_PLUGIN_SCANNER=/opt/golive-p2p/native-media/gst-plugin-scanner GST_REGISTRY=/tmp/golive-srtp-registry.bin work/qt-client/work/qt-linux/srtp-runtime-test > work/rpm-srtp.json
          python3 - <<'PY'
          import json
          v=json.load(open('work/rpm-smoke.json'))
          assert v['ui']=='Qt Widgets' and 'Motor C++ pronto' in v['logs'],v
          print('Installed Fedora RPM started Qt UI and native engine successfully')
          PY
          # Verify removal leaves no application executable or menu entry.
          dnf remove -y golive-p2p
          test ! -e /opt/golive-p2p
          test ! -e /usr/bin/golive-p2p
          test ! -e /usr/share/applications/golive-p2p.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: qt-fedora-rpm
          path: |
            release/*.rpm
            release/SHA256SUMS-rpm-0.6.0-qt.4.txt
            work/rpm-*.txt
            work/rpm-smoke.json
            work/rpm-srtp.json
            work/rpmlint.txt
          if-no-files-found: error
